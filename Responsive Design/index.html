<body>
  <header>
    <h1 id="top">Trees Below The Surface</h1>

  <main>
   
    <p>Have you ever looked at a tree and wondered what lies beneath the ground? While every tree has roots, not all root systems are the same. Explore this gallery to discover different tree species and the root types they develop.
</p>
    
    <div class = "grid">
        <figure>
        <img src="Images/Apple.Tree.jpg" alt="An Apple Tree." width="200">
        <figcaption>Apple Tree</figcaption>
        </figure>
        <figure>
        <img src="Images/Willow.jpg" alt="A Willow in low angle shot." width="200">
        <figcaption>Willow</figcaption>
        </figure>
        <figure>
        <img src="Images/Shallow-root.System.png" alt="Illustration of a shallow-root system of a tree." width="200">
        <figcaption>Shallow-Root System</figcaption> 
        </figure>
        <figure>
        <img src="Images/Pine.Tree.jpg" alt="A meadow full of Pine trees on a sunny day." width="200">
        <figcaption>Pine Tree</figcaption>
        </figure>
        <figure>
        <img src="Images/Ash.jpg" alt="An Ash on a hill." width="200">
        <figcaption>Ash</figcaption>
        </figure>
        <figure>
        <img src="Images/Tap-root.System.png" alt="Illustration of a tap-root system of a tree." width="200">
        <figcaption>Tap-Root System</figcaption>
        </figure>
        <figure>
        <img src="Images/Beech.jpg" alt="A Beech in the forest in autumn." width="200">
        <figcaption>Beech</figcaption>
        </figure>
        <figure>
        <img src="Images/Larch.jpg" alt="A Larch on the border of a forest in autumn." width="200">
        <figcaption>Larch</figcaption>
        </figure>
        <figure>
        <img src="Images/Heart-root.System.png" alt="Illustration of a heart-root system of a tree." width="200">
        <figcaption>Heart-Root System</figcaption>
        </figure>

  <footer>
    <a href="#top">Jump to the Top</a>

</html>
